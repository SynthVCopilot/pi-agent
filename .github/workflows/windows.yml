name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Provision pinned FFmpeg for integration test
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-04-21-26/ffmpeg-n8.1.2-34-g9b6c8969e0-win64-lgpl-8.1.zip'
          $expected = '534b3bfe48de5d3d181430294602a5977a198a47a28e48a1599545eab0ab7a60'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $ffmpeg = Get-ChildItem -LiteralPath $expanded -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if ($null -eq $ffmpeg -or -not (Test-Path -LiteralPath (Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'))) {
            throw 'Pinned archive does not contain an FFmpeg/ffprobe pair'
          }
          $ffmpeg.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test real FFmpeg operations
        run: cargo test -p pi-agent-components --test system_ffmpeg -- --ignored
      - name: Build release FFI DLL
        run: cargo build -p pi-agent-ffi --release
      - name: Check Windows ARM64
        run: cargo check --workspace --target aarch64-pc-windows-msvc
